; BCA152 FreeRTOS Multisensor — PlatformIO project (ESP-IDF only, no Arduino)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Sensor / display driver notes:
; This project uses hand-rolled, minimal drivers (bit-bang DHT22, raw I2C
; SSD1306 command writes) instead of Arduino libraries so the whole app stays
; on native ESP-IDF/FreeRTOS APIs, per the lab's "no Arduino" rule.
; If you prefer, you can swap in ESP-IDF component-registry libraries
; (idf_component.yml) for DHT22 / SSD1306 instead of the bit-bang versions —
; just be ready to explain whichever one you actually ship.
; ---------------------------------------------------------------------------

test_framework = unity
